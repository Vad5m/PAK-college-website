<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ item_title }}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
body { display: flex; flex-direction: column; background: #f8fafc; }

.page-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; background: #0b3b5f; color: #fff; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.page-header h1 { font-size: 16px; font-weight: 600; margin: 0; }
.page-header-actions { display: flex; gap: 8px; }
.page-header-actions button {
    padding: 8px 20px; border-radius: 8px; font-size: 14px; font-family: inherit;
    font-weight: 500; cursor: pointer; border: none; transition: background 0.15s;
}
.btn-save { background: #3b82f6; color: #fff; }
.btn-save:hover { background: #2563eb; }
.btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-close { background: rgba(255,255,255,0.15); color: #fff; }
.btn-close:hover { background: rgba(255,255,255,0.3); }

.page-frame { flex: 1; min-height: 0; }
.page-frame iframe { width: 100%; height: 100%; border: none; display: block; }

.page-view {
    flex: 1;
    overflow-y: auto;
    padding: 0;
}
.page-view-inner {
    width: 100%;
    max-width: none;
    margin: 0;
    background: #ffffff;
    padding: 32px;
    border-radius: 0;
    border: none;
    box-shadow: none;
    font-size: 1rem;
    line-height: 1.8;
    color: #334155;
    box-sizing: border-box;
    white-space: pre-wrap;
}
.page-view-inner h1 { font-size: 1.8rem; color: #0b3b5f; margin-top: 0; }
.page-view-inner h2 { font-size: 1.5rem; color: #0b3b5f; margin-top: 20px; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
.page-view-inner h3 { font-size: 1.3rem; color: #1e6a8f; margin-top: 15px; }
.page-view-inner h4, .page-view-inner h5, .page-view-inner h6 { color: #1e6a8f; }
.page-view-inner a { color: #0b3b5f; text-decoration: underline; }
.page-view-inner a:hover { color: #1e6a8f; }
.page-view-inner table { border-collapse: collapse; width: 100%; margin: 15px 0; }
.page-view-inner table, .page-view-inner th, .page-view-inner td { border: 1px solid #cbd5e1; }
.page-view-inner th, .page-view-inner td { padding: 8px 12px; text-align: left; }
.page-view-inner th { background: #f1f5f9; font-weight: 600; }
.page-view-inner ul, .page-view-inner ol { margin: 10px 0; padding-left: 25px; }
.page-view-inner img { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; }
.page-view-inner iframe { max-width: 100%; }

.page-view-inner .inserted-image {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    margin: 10px 0;
    display: block;
}

.page-view-inner .inserted-video {
    position: relative;
    max-width: 100%;
    border-radius: 8px;
    margin: 10px 0;
    display: block;
    overflow: hidden;
    background: #000;
}

.page-view-inner .inserted-video video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.page-view-inner .inserted-file {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #e2e8f0;
    color: #0f172a;
    padding: 6px 12px;
    border-radius: 8px;
    margin: 2px 0;
    font-size: 14px;
    text-decoration: none;
    border: 1px solid #cbd5e1;
    vertical-align: middle;
}
.page-view-inner .inserted-file:hover { background: #cbd5e1; }
.page-view-inner .inserted-file .file-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
}
.page-view-inner .inserted-file .file-icon img,
.page-view-inner .inserted-file .file-icon svg {
    width: 20px;
    height: 20px;
    display: block;
    stroke: #0f172a;
}
.page-view-inner .inserted-file .file-icon img {
    filter: brightness(0) saturate(100%) invert(15%) sepia(15%) saturate(1000%) hue-rotate(190deg) brightness(95%) contrast(95%);
}
.page-view-inner .inserted-file .file-name { font-weight: 600; }
.page-view-inner .inserted-file .file-size { color: #64748b; font-size: 12px; }

.page-view-inner .inserted-link {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 6px 12px;
    margin: 2px 0;
    text-decoration: none;
    max-width: 100%;
    vertical-align: middle;
}
.page-view-inner .inserted-link:hover { background: #dbeafe; }
.page-view-inner .inserted-link .link-title {
    font-weight: 600;
    font-size: 14px;
    color: #1e40af;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.page-view-inner .inserted-link .link-url {
    font-size: 12px;
    color: #3b82f6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.page-view-inner .inserted-table {
    border-collapse: collapse;
    margin: 12px 0;
    width: auto;
    min-width: 200px;
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
}
.page-view-inner .inserted-table td,
.page-view-inner .inserted-table th {
    border: 1px solid #cbd5e1;
    padding: 8px 12px;
    min-width: 60px;
    font-size: 15px;
    color: #0f172a;
    vertical-align: top;
}
.page-view-inner .inserted-table tr:first-child td,
.page-view-inner .inserted-table tr:first-child th {
    background: #f1f5f9;
    font-weight: 600;
}

.page-view-inner a.inserted-file,
.page-view-inner a.inserted-link { text-decoration: none; }

.file-preview-tooltip {
    position: fixed;
    z-index: 1500;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    padding: 12px 14px;
    max-width: 380px;
    min-width: 220px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease;
    font-size: 13px;
    color: #0f172a;
    line-height: 1.5;
    overflow: hidden;
}
.file-preview-tooltip.show { opacity: 1; transform: translateY(0); }
.file-preview-tooltip .preview-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e2e8f0;
}
.file-preview-tooltip .preview-header .preview-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.file-preview-tooltip .preview-header .preview-icon svg,
.file-preview-tooltip .preview-header .preview-icon img {
    width: 20px;
    height: 20px;
    display: block;
    stroke: #0f172a;
}
.file-preview-tooltip .preview-header .preview-icon img {
    filter: brightness(0) saturate(100%) invert(15%) sepia(15%) saturate(1000%) hue-rotate(190deg) brightness(95%) contrast(95%);
}
.file-preview-tooltip .preview-header .preview-name {
    font-weight: 600;
    font-size: 13px;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
}
.file-preview-tooltip .preview-body {
    max-height: 220px;
    overflow: hidden;
    font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.5;
    color: #475569;
    white-space: pre-wrap;
    word-break: break-word;
}
.file-preview-tooltip .preview-body.text-preview {
    font-family: inherit;
    font-size: 13px;
}
.file-preview-tooltip .preview-body img,
.file-preview-tooltip .preview-body video,
.file-preview-tooltip .preview-body iframe {
    max-width: 100%;
    max-height: 200px;
    border-radius: 6px;
    display: block;
}
.file-preview-tooltip .preview-footer {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #e2e8f0;
    font-size: 11px;
    color: #94a3b8;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.file-preview-tooltip .preview-loading {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #94a3b8;
    font-size: 12px;
    padding: 6px 0;
}
.file-preview-tooltip .preview-loading .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid #e2e8f0;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 767px) {
    .page-view-inner { padding: 20px; }
}

.save-status {
    position: fixed; bottom: 16px; right: 20px; padding: 8px 16px;
    background: #1e293b; color: #fff; border-radius: 20px; font-size: 13px;
    opacity: 0; transform: translateY(6px); transition: opacity 0.25s, transform 0.25s;
    pointer-events: none; z-index: 100;
}
.save-status.show { opacity: 1; transform: translateY(0); }
.save-status.ok { background: #16a34a; }
.save-status.err { background: #ef4444; }
</style>
</head>
<body>
<div class="page-header">
    <h1>{{ item_title }}</h1>
    <div class="page-header-actions">
        {% if mode == 'edit' or mode == 'new' %}
        <button class="btn-save" id="saveBtn">Сохранить</button>
        {% endif %}
        <button class="btn-close" id="closeBtn">Закрыть</button>
    </div>
</div>

{% if mode == 'view' %}
<div class="page-view">
    <div class="page-view-inner" id="pageViewInner">
        {{ item_html|safe }}
    </div>
</div>
{% else %}
<div class="page-frame">
    <iframe id="editorFrame" src="/text_redactor?admin=1"></iframe>
</div>
{% endif %}

<div class="save-status" id="saveStatus"></div>

<div class="file-preview-tooltip" id="filePreviewTooltip">
    <div class="preview-header">
        <span class="preview-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        </span>
        <span class="preview-name"></span>
    </div>
    <div class="preview-body"></div>
    <div class="preview-footer">
        <span class="preview-type"></span>
        <span class="preview-size"></span>
    </div>
</div>

{% if mode == 'edit' or mode == 'new' %}
<script>
var MODE = "{{ mode }}";
var ITEM_ID = {{ item_id|default(0) }};
var ITEM_TITLE = {{ item_title|tojson }};
var ITEM_HTML = {{ item_html|tojson }};
var PAGE_TYPE = "{{ page_type|default('home') }}";
var frame = document.getElementById('editorFrame');
var saveBtn = document.getElementById('saveBtn');
var closeBtn = document.getElementById('closeBtn');
var saveStatus = document.getElementById('saveStatus');

var updateUrls = {
    'home': '/admin/update_left_menu/',
    'staff': '/admin/update_staff_menu/',
    'abiturient': '/admin/update_abiturient_menu/',
    'parents': '/admin/update_parents_menu/',
    'students': '/admin/update_students_menu/'
};

var addUrls = {
    'home': '/admin/add_left_menu',
    'staff': '/admin/add_staff_menu',
    'abiturient': '/admin/add_abiturient_menu',
    'parents': '/admin/add_parents_menu',
    'students': '/admin/add_students_menu'
};

function showStatus(text, cls) {
    saveStatus.textContent = text;
    saveStatus.className = 'save-status show ' + (cls || '');
    setTimeout(function() { saveStatus.classList.remove('show'); }, 1800);
}

frame.onload = function() {
    setTimeout(function() {
        try {
            var win = frame.contentWindow;
            if (win.VD5Editor) {
                win.VD5Editor.setEditing(true);
                if (ITEM_HTML && ITEM_HTML.trim()) {
                    win.postMessage({ type: 'setContent', html: ITEM_HTML }, '*');
                } else {
                    win.postMessage({ type: 'clearContent' }, '*');
                }
            }
        } catch (e) { console.error(e); }
    }, 300);
};

if (saveBtn) {
    saveBtn.addEventListener('click', function() {
        var win = frame.contentWindow;
        var html = '';
        try {
            if (win.VD5Editor) html = win.VD5Editor.getHTML();
        } catch (e) { html = ''; }
        if (!html || !html.trim()) {
            showStatus('Пусто — нечего сохранять', 'err');
            return;
        }

        var url, payload;
        if (MODE === 'new') {
            url = addUrls[PAGE_TYPE] || addUrls['home'];
            payload = { letter: ITEM_TITLE, text: html, link: '' };
        } else {
            url = (updateUrls[PAGE_TYPE] || updateUrls['home']) + ITEM_ID;
            payload = { letter: ITEM_TITLE, text: html, link: '' };
        }

        saveBtn.disabled = true;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(function(r) { return r.json(); })
        .then(function(resp) {
            if (resp && resp.success) {
                ITEM_HTML = html;
                showStatus('Сохранено', 'ok');
                if (MODE === 'new' && resp.item && resp.item.id) {
                    ITEM_ID = resp.item.id;
                    MODE = 'edit';
                }
                if (window.opener && !window.opener.closed && typeof window.opener.refreshLeftMenu === 'function') {
                    try { window.opener.refreshLeftMenu(); } catch (e) {}
                }
            } else {
                showStatus('Ошибка: ' + ((resp && resp.message) || 'неизвестно'), 'err');
            }
        })
        .catch(function() { showStatus('Ошибка сети', 'err'); })
        .finally(function() { saveBtn.disabled = false; });
    });
}

closeBtn.addEventListener('click', function() {
    if (window.opener) window.close();
    else window.location.href = '/';
});
</script>
{% else %}
<script>
var closeBtn = document.getElementById('closeBtn');
closeBtn.addEventListener('click', function() {
    if (window.opener) window.close();
    else window.location.href = '/';
});

(function() {
    var container = document.getElementById('pageViewInner');
    var filePreviewTooltip = document.getElementById('filePreviewTooltip');
    var previewTooltipTimer = null;
    var previewTooltipTarget = null;
    var previewTooltipRequestId = 0;

    if (container) {
        container.querySelectorAll('.inserted-video video').forEach(function(v) {
            v.setAttribute('controls', '');
        });
    }

    function formatFileSize(bytes) {
        bytes = parseInt(bytes, 10) || 0;
        if (bytes === 0) return '0 Б';
        var k = 1024;
        var sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
        var i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHtmlText(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function getFileCategory(fileType, fileName) {
        var type = (fileType || '').toLowerCase();
        var name = (fileName || '').toLowerCase();
        if (type.startsWith('image/')) return 'image';
        if (type.startsWith('video/')) return 'video';
        if (type.startsWith('audio/')) return 'audio';
        if (type.includes('pdf') || name.endsWith('.pdf')) return 'pdf';
        if (type.startsWith('text/') || type.includes('json') || type.includes('xml') ||
            type.includes('javascript') || type.includes('html') || type.includes('css') ||
            name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.log') ||
            name.endsWith('.csv') || name.endsWith('.json') || name.endsWith('.xml') ||
            name.endsWith('.js') || name.endsWith('.ts') || name.endsWith('.html') ||
            name.endsWith('.css') || name.endsWith('.py') || name.endsWith('.java') ||
            name.endsWith('.c') || name.endsWith('.cpp') || name.endsWith('.h')) return 'text';
        return 'other';
    }

    function isPreviewableFile(fileType, fileName) {
        var type = (fileType || '').toLowerCase();
        var name = (fileName || '').toLowerCase();
        if (type.startsWith('text/')) return true;
        if (type.startsWith('image/')) return true;
        if (type.startsWith('video/')) return true;
        if (type.startsWith('audio/')) return true;
        if (type.includes('pdf')) return true;
        if (type.includes('json')) return true;
        if (type.includes('xml')) return true;
        if (type.includes('javascript')) return true;
        if (type.includes('html')) return true;
        if (type.includes('css')) return true;
        if (name.endsWith('.txt')) return true;
        if (name.endsWith('.md')) return true;
        if (name.endsWith('.log')) return true;
        if (name.endsWith('.csv')) return true;
        if (name.endsWith('.json')) return true;
        if (name.endsWith('.xml')) return true;
        if (name.endsWith('.js')) return true;
        if (name.endsWith('.ts')) return true;
        if (name.endsWith('.html')) return true;
        if (name.endsWith('.css')) return true;
        if (name.endsWith('.py')) return true;
        if (name.endsWith('.java')) return true;
        if (name.endsWith('.c')) return true;
        if (name.endsWith('.cpp')) return true;
        if (name.endsWith('.h')) return true;
        if (name.endsWith('.pdf')) return true;
        return false;
    }

    function positionFilePreview(rect) {
        var tooltipRect = filePreviewTooltip.getBoundingClientRect();
        var left = rect.left;
        var top = rect.bottom + 10;
        if (left + tooltipRect.width > window.innerWidth - 10) {
            left = window.innerWidth - tooltipRect.width - 10;
        }
        if (left < 10) left = 10;
        if (top + tooltipRect.height > window.innerHeight - 10) {
            top = rect.top - tooltipRect.height - 10;
        }
        if (top < 10) top = 10;
        filePreviewTooltip.style.left = left + 'px';
        filePreviewTooltip.style.top = top + 'px';
    }

    function showFilePreviewLoading() {
        filePreviewTooltip.querySelector('.preview-body').innerHTML =
            '<div class="preview-loading"><span class="spinner"></span><span>Загрузка предпросмотра…</span></div>';
    }

    function renderTextPreview(text, maxChars) {
        var limit = maxChars || 1200;
        var display = text;
        var truncated = false;
        if (display.length > limit) {
            display = display.slice(0, limit);
            truncated = true;
        }
        var html = '<div class="text-preview">' + escapeHtmlText(display) + '</div>';
        if (truncated) {
            html += '<div style="margin-top:6px;color:#94a3b8;font-size:11px;">… ещё ' +
                (text.length - limit) + ' символов</div>';
        }
        return html;
    }

    function loadFilePreviewData(fileEl) {
        var fileUrl = fileEl.dataset.fileurl || fileEl.dataset.objectUrl;
        var fileName = fileEl.dataset.filename || 'file';
        var fileType = fileEl.dataset.filetype || '';
        var fileSize = parseInt(fileEl.dataset.filesize || '0', 10);
        var requestId = ++previewTooltipRequestId;
        filePreviewTooltip.querySelector('.preview-name').textContent = fileName;
        filePreviewTooltip.querySelector('.preview-type').textContent = fileType || 'неизвестный тип';
        filePreviewTooltip.querySelector('.preview-size').textContent = formatFileSize(fileSize);
        if (!fileUrl) {
            filePreviewTooltip.querySelector('.preview-body').innerHTML =
                '<div style="color:#94a3b8;font-size:12px;">Предпросмотр недоступен</div>';
            return;
        }
        var category = getFileCategory(fileType, fileName);
        if (category === 'image') {
            var img = document.createElement('img');
            img.onload = function() {
                if (requestId !== previewTooltipRequestId) return;
                filePreviewTooltip.querySelector('.preview-body').innerHTML = '';
                filePreviewTooltip.querySelector('.preview-body').appendChild(img);
                if (previewTooltipTarget) positionFilePreview(previewTooltipTarget.getBoundingClientRect());
            };
            img.onerror = function() {
                if (requestId !== previewTooltipRequestId) return;
                filePreviewTooltip.querySelector('.preview-body').innerHTML =
                    '<div style="color:#94a3b8;font-size:12px;">Не удалось загрузить изображение</div>';
            };
            img.src = fileUrl;
            return;
        }
        if (category === 'video') {
            var video = document.createElement('video');
            video.src = fileUrl;
            video.controls = false;
            video.muted = true;
            video.preload = 'metadata';
            video.onloadedmetadata = function() {
                if (requestId !== previewTooltipRequestId) return;
                filePreviewTooltip.querySelector('.preview-body').innerHTML = '';
                filePreviewTooltip.querySelector('.preview-body').appendChild(video);
                if (previewTooltipTarget) positionFilePreview(previewTooltipTarget.getBoundingClientRect());
            };
            video.onerror = function() {
                if (requestId !== previewTooltipRequestId) return;
                filePreviewTooltip.querySelector('.preview-body').innerHTML =
                    '<div style="color:#94a3b8;font-size:12px;">Не удалось загрузить видео</div>';
            };
            return;
        }
        if (category === 'audio') {
            var audio = document.createElement('audio');
            audio.src = fileUrl;
            audio.controls = true;
            audio.preload = 'metadata';
            if (requestId !== previewTooltipRequestId) return;
            filePreviewTooltip.querySelector('.preview-body').innerHTML = '';
            filePreviewTooltip.querySelector('.preview-body').appendChild(audio);
            if (previewTooltipTarget) positionFilePreview(previewTooltipTarget.getBoundingClientRect());
            return;
        }
        if (category === 'pdf') {
            var iframe = document.createElement('iframe');
            iframe.src = fileUrl + '#toolbar=0&navpanes=0&scrollbar=0&view=FitH';
            iframe.style.width = '340px';
            iframe.style.height = '200px';
            iframe.style.border = 'none';
            if (requestId !== previewTooltipRequestId) return;
            filePreviewTooltip.querySelector('.preview-body').innerHTML = '';
            filePreviewTooltip.querySelector('.preview-body').appendChild(iframe);
            if (previewTooltipTarget) positionFilePreview(previewTooltipTarget.getBoundingClientRect());
            return;
        }
        if (category === 'text') {
            showFilePreviewLoading();
            fetch(fileUrl)
                .then(function(res) { return res.text(); })
                .then(function(text) {
                    if (requestId !== previewTooltipRequestId) return;
                    filePreviewTooltip.querySelector('.preview-body').innerHTML = renderTextPreview(text, 1200);
                    if (previewTooltipTarget) positionFilePreview(previewTooltipTarget.getBoundingClientRect());
                })
                .catch(function() {
                    if (requestId !== previewTooltipRequestId) return;
                    filePreviewTooltip.querySelector('.preview-body').innerHTML =
                        '<div style="color:#94a3b8;font-size:12px;">Не удалось прочитать файл</div>';
                });
            return;
        }
        filePreviewTooltip.querySelector('.preview-body').innerHTML =
            '<div style="color:#94a3b8;font-size:12px;">Предпросмотр для этого типа файла недоступен</div>';
    }

    function showFilePreview(fileEl) {
        if (!fileEl) return;
        previewTooltipTarget = fileEl;
        loadFilePreviewData(fileEl);
        filePreviewTooltip.classList.add('show');
        requestAnimationFrame(function() {
            if (previewTooltipTarget) {
                positionFilePreview(previewTooltipTarget.getBoundingClientRect());
            }
        });
    }

    function hideFilePreview() {
        filePreviewTooltip.classList.remove('show');
        previewTooltipTarget = null;
        if (previewTooltipTimer) {
            clearTimeout(previewTooltipTimer);
            previewTooltipTimer = null;
        }
    }

    if (container) {
        container.addEventListener('mouseover', function(e) {
            var fileEl = e.target.closest && e.target.closest('.inserted-file');
            if (!fileEl) return;
            if (!isPreviewableFile(fileEl.dataset.filetype, fileEl.dataset.filename)) return;
            if (previewTooltipTarget === fileEl) return;
            if (previewTooltipTimer) clearTimeout(previewTooltipTimer);
            previewTooltipTimer = setTimeout(function() {
                showFilePreview(fileEl);
            }, 350);
        });

        container.addEventListener('mouseout', function(e) {
            var fileEl = e.target.closest && e.target.closest('.inserted-file');
            if (!fileEl) return;
            var related = e.relatedTarget;
            if (related && fileEl.contains(related)) return;
            if (related && related.closest && related.closest('.inserted-file') === fileEl) return;
            if (previewTooltipTimer) {
                clearTimeout(previewTooltipTimer);
                previewTooltipTimer = null;
            }
            hideFilePreview();
        });
    }

    filePreviewTooltip.addEventListener('mouseenter', function() {
        if (previewTooltipTimer) {
            clearTimeout(previewTooltipTimer);
            previewTooltipTimer = null;
        }
    });

    filePreviewTooltip.addEventListener('mouseleave', function() {
        hideFilePreview();
    });

    document.addEventListener('mousedown', function(e) {
        if (!e.target.closest || !e.target.closest('.inserted-file')) {
            hideFilePreview();
        }
    });

    window.addEventListener('scroll', hideFilePreview, true);
    window.addEventListener('resize', hideFilePreview);
})();
</script>
{% endif %}
</body>
</html>
